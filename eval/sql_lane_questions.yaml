- id: q20
  question: What share of the total amount paid does each payment method account for?
  difficulty: medium
  tables:
  - order_payments
  answerable: true
  expected_status: ok
  expected_shape:
    kind: grouped
    max_rows: null
    order_matters: false
  rules:
  - SQL4
  expected_assumptions: []
  reference_sql: |-
    SELECT method,
      round(100.0 * sum(amount) / (SELECT sum(amount) FROM order_payments), 2) AS amount_pct
    FROM order_payments
    GROUP BY method
  expected_result:

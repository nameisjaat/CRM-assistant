- id: q10
  question: Which 5 product categories sold the most units in 2017, excluding canceled and unavailable
    orders?
  difficulty: medium
  tables:
  - order_items
  - orders
  - products
  answerable: true
  expected_status: ok
  expected_shape:
    kind: list
    max_rows: 5
    order_matters: true
  rules:
  - C2
  - SQL7
  expected_assumptions:
  - Each order_items row is one unit
  reference_sql: |-
    SELECT p.category, count(*) AS units
    FROM order_items i
    JOIN orders o ON o.order_id = i.order_id
    JOIN products p ON p.product_id = i.product_id
    WHERE o.status NOT IN ('canceled', 'unavailable')
      AND extract(year FROM o.purchased_at) = 2017
    GROUP BY p.category
    ORDER BY units DESC
    LIMIT 5
  expected_result:
    columns: [category, units]
    rows:
    - [bed_bath_table, 5216]
    - [furniture_decor, 4131]
    - [sports_leisure, 4070]

    - [computers_accessories, 3077]
    truncated: false
    row_count: 5
  notes: No tie at the cut-off (5th = 3,077, 6th = 2,883).
  verification: 'C2: COUNT(*) per category; SQL7: ORDER BY units DESC LIMIT 5. Status exclusion as stated.
    No tie at the cut-off (3,077 vs 2,883).'
  verified: true

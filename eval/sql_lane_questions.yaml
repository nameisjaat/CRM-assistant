    SP revenue (5,309,379.51 vs 5,069,547.64). C1: status = ''delivered'' already excludes canceled/unavailable;
    no freight. C8: customers.state; delivery_state changes BA, CE, DF, ES, GO. LEFT JOINs keep the one

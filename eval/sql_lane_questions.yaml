# Golden set for the sql_query lane (step2-sql-lane-rules.md, Part F).
#
# Drafted and self-checked by Claude Code; reviewed by the project owner, who set every entry to
# verified: true (2026-11-15). Only verified entries count.
# expected_result was produced by running reference_sql read-only against the analytics
# schema (search_path analytics, time zone America/Sao_Paulo). The data is static.
#
# Fields (names follow sql_lane/state.py, so result[...] compares with expected_...)
#   id, question, difficulty (easy | medium | hard)
#   tables                    minimum tables the answer needs; state.tables must contain them
#   answerable                expected state.answerable
#   expected_status           expected state.status: ok | unanswerable
#   expected_shape            expected state.expected_shape: {kind, max_rows, order_matters}
#                             (max_rows = the LIMIT, null when there is none); null if unanswerable
#   rules                     traps tested, i.e. rules whose violation changes the answer: Part C
#                             ids (C1..C15), SQL rule ids, default:<name>, A4:<topic>, empty_result.
#                             Rules followed but not testable on this data are explained in verification.
#   expected_assumptions      defaults state.assumptions should contain (LLM-judge metric)
#   reference_sql             returns only the columns the question asks for
#   expected_result           expected state.columns, state.rows, state.truncated (+ row_count)
#   unanswerable_reason_topic (unanswerable only) what state.unanswerable_reason should mention
#   notes                     why this is the answer
#   verification              Claude Code's self-check: each listed rule checked against
#                             sql_lane/rules.py, and whether breaking the trap changes the answer
#   verified                  true only after the project owner has reviewed reference_sql
#
# Scoring (agreed): compare results, not SQL text
#   - ignore column names and column order; extra columns in the pipeline's result are fine
#     as long as every reference column's values appear among them
#   - ignore row order unless shape.order_matters is true
#   - numbers match within 0.01
#   - time_series month/year labels: the pipeline may format them differently (2017-01,
#     2017-01-01, 1); the scorer should normalise labels or compare by position.

- id: q01
  question: How many customers are there?
  difficulty: easy
  tables:
  - customers
  answerable: true
  expected_status: ok
  expected_shape:
    kind: single_value
    max_rows: null
    order_matters: false
  rules: []
  expected_assumptions:
  - 'Customers are counted as real people: COUNT(DISTINCT customer_id)'
  reference_sql: |-
    SELECT count(DISTINCT customer_id) AS customer_count
    FROM customers
  expected_result:
    columns: [customer_count]
    rows:
    - [96096]
    truncated: false
    row_count: 1
  notes: customers has one row per real person (Step 1 merged repeat customer ids).
  verification: 'C4: COUNT(DISTINCT customer_id) as required. Trap does not change the answer here: customers
    already has one row per person (COUNT(*) = 96,096 too).'
  verified: true
- id: q02
  question: How many orders were placed this year?
  difficulty: easy
  tables:
  - orders
  answerable: true
  expected_status: ok
  expected_shape:
    kind: single_value
    max_rows: null
    order_matters: false
  rules:
  - C3
  - default:this_year
  expected_assumptions:
  - '''This year'' means 2018, the latest year in the data'
  reference_sql: |-
    SELECT count(*) AS order_count
    FROM orders
    WHERE extract(year FROM purchased_at) = 2018
  expected_result:
    columns: [order_count]
    rows:
    - [54011]
    truncated: false
    row_count: 1
  notes: '''This year'' is anchored to the latest purchased_at (2018-10-17), not today''s date. Counts
    every order regardless of status.'
  verification: 'C3: counted from orders. ''This year'' = 2018 (latest purchased_at 2018-10-17). Trap
    changes the answer: using the current calendar year gives 0.'
  verified: true
- id: q03
  question: How many units of health and beauty products were sold, excluding canceled and unavailable
    orders?
  difficulty: medium
  tables:
  - order_items
  - orders
  - products
  answerable: true
  expected_status: ok
  expected_shape:
    kind: single_value
    max_rows: null
    order_matters: false
  rules:
  - C2
  - default:category_words
  expected_assumptions:
  - '''Health and beauty'' is the category health_beauty'
  - Each order_items row is one unit
  reference_sql: |-
    SELECT count(*) AS units
    FROM order_items i
    JOIN orders o ON o.order_id = i.order_id
    JOIN products p ON p.product_id = i.product_id
    WHERE p.category = 'health_beauty'
      AND o.status NOT IN ('canceled', 'unavailable')
  expected_result:
    columns: [units]
    rows:
    - [9634]
    truncated: false
    row_count: 1
  notes: 'No quantity column: buying 3 of a product is 3 rows. The status exclusion is stated in the question
    so the answer isn''t ambiguous.'
  verification: 'C2: COUNT(*) of order_items rows. SQL6: ''health_beauty'' is the only category matching
    ''health and beauty'' (no other value contains ''beauty''). Status exclusion as stated in the question.'
  verified: true
- id: q04
  question: What is the average review score of orders delivered to the state of AM?
  difficulty: medium
  tables:
  - order_reviews
  - orders
  answerable: true
  expected_status: ok
  expected_shape:
    kind: single_value
    max_rows: null
    order_matters: false
  rules:
  - C6
  expected_assumptions:
  - Uses only the latest review per order
  - '''Delivered to AM'' means orders.delivery_state = ''AM'''
  reference_sql: |-
    SELECT round(avg(r.score), 2) AS avg_score
    FROM order_reviews r
    JOIN orders o ON o.order_id = r.order_id
    WHERE r.is_latest_for_order
      AND o.delivery_state = 'AM'
  expected_result:
    columns: [avg_score]
    rows:
    - [4.21]
    truncated: false
    row_count: 1
  notes: Where an order went = orders.delivery_state (C8). Without is_latest_for_order, orders with several
    reviews count more than once.
  verification: 'C6: filters is_latest_for_order; changes the answer (4.21 with, 4.18 without). C8: orders.delivery_state
    for ''delivered to''; customers.state happens to give the same 4.21 for AM, so this question does
    not test C8.'
  verified: true
- id: q05
  question: What percentage of delivered orders arrived late?
  difficulty: medium
  tables:
  - orders
  answerable: true
  expected_status: ok
  expected_shape:
    kind: single_value
    max_rows: null
    order_matters: false
  rules:
  - C7
  - SQL4
  expected_assumptions:
  - Only delivered orders without date issues
  reference_sql: |-
    SELECT round(100.0 * avg(CASE WHEN is_late THEN 1 ELSE 0 END), 2) AS late_pct
    FROM orders
    WHERE status = 'delivered' AND NOT has_date_issue
  expected_result:
    columns: [late_pct]
    rows:
    - [6.77]
    truncated: false
    row_count: 1
  notes: Percentage on a 0-100 scale. Orders with date issues are excluded (C7).
  verification: 'C7: status = ''delivered'' AND NOT has_date_issue. The status filter changes the answer
    (6.77 with, 6.57 without); the has_date_issue part does not (its 8 delivered orders have NULL is_late).
    SQL4: 0-100 scale, alias ends in _pct.'
  verified: true
- id: q06
  question: What was the average order value in 2018?
  difficulty: hard
  tables:
  - order_items
  - orders
  answerable: true
  expected_status: ok
  expected_shape:
    kind: single_value
    max_rows: null
    order_matters: false
  rules:
  - C1
  - C3
  expected_assumptions:
  - Order value = sum of item prices, freight excluded
  - Canceled and unavailable orders are excluded
  reference_sql: |-
    WITH per_order AS (
      SELECT i.order_id, sum(i.unit_price) AS order_revenue
      FROM order_items i
      JOIN orders o ON o.order_id = i.order_id
      WHERE o.status NOT IN ('canceled', 'unavailable')
        AND extract(year FROM o.purchased_at) = 2018
      GROUP BY i.order_id
    )
    SELECT round(avg(order_revenue), 2) AS avg_order_revenue
    FROM per_order
  expected_result:
    columns: [avg_order_revenue]
    rows:
    - [137.14]
    truncated: false
    row_count: 1
  notes: Revenue per order first, then the average over orders. Equal to total revenue / number of orders
    with items. Averaging item prices directly would be wrong.
  verification: 'C1: SUM(unit_price), canceled/unavailable excluded, no freight. Per-order value first:
    equals total revenue / distinct orders (137.14); averaging item prices gives 120.08, so the trap changes
    the answer.'
  verified: true

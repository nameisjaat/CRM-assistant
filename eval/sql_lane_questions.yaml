- id: q21
  question: For delivered orders, what are the total amount paid and the total product revenue in each
    customer state?
  difficulty: hard
  tables:
  - order_payments
  - order_items
  - orders
  - customers
  answerable: true
  expected_status: ok
  expected_shape:
    kind: grouped
    max_rows: null
    order_matters: false
  rules:
  - C5
  - C1
  - C8
  expected_assumptions:
  - Product revenue = sum of item prices, freight excluded
  - State = where the customer lives
  reference_sql: |-
    WITH pay AS (
      SELECT order_id, sum(amount) AS paid_amount FROM order_payments GROUP BY order_id
    ),
    items AS (
      SELECT order_id, sum(unit_price) AS item_revenue FROM order_items GROUP BY order_id
    )
    SELECT c.state,
      round(sum(pay.paid_amount), 2) AS total_paid_amount,
      round(sum(items.item_revenue), 2) AS revenue
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    LEFT JOIN pay ON pay.order_id = o.order_id
    LEFT JOIN items ON items.order_id = o.order_id
    WHERE o.status = 'delivered'
    GROUP BY c.state
  expected_result:
    columns: [state, total_paid_amount, revenue]
    rows:

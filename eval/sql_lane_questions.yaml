- id: q12
  question: Which 3 sellers had the highest average review score, among sellers with at least 50 reviewed
    orders?
  difficulty: hard
  tables:
  - order_items
  - order_reviews
  answerable: true
  expected_status: ok
  expected_shape:
    kind: list
    max_rows: 3
    order_matters: true
  rules:
  - C6
  - C5
  expected_assumptions:
  - Uses only the latest review per order
  - An order with several sellers counts for each of them
  reference_sql: |-
    WITH seller_orders AS (
      SELECT DISTINCT order_id, seller_id FROM order_items
    ),
    r AS (
      SELECT order_id, score FROM order_reviews WHERE is_latest_for_order
    )
    SELECT so.seller_id, round(avg(r.score), 2) AS avg_score
    FROM seller_orders so
    JOIN r ON r.order_id = so.order_id
    GROUP BY so.seller_id
    HAVING count(*) >= 50
    ORDER BY avg_score DESC
    LIMIT 3
  expected_result:
    columns: [seller_id, avg_score]
    rows:
    - [d13e50eaa47b4cbe9eb81465865d8cfc, 4.82]
    - [d9bd94811c3338dceb4181f3dbc0c73e, 4.8]
    - [d566c37fa119d5e66c4e9052e83ee4ea, 4.69]
    truncated: false
    row_count: 3
  notes: One row per (order, seller) so an order with 3 items from one seller counts once. No tie at the
    cut-off (3rd = 4.69, 4th = 4.67).
  verification: 'C6: latest review only; C5: order_items and order_reviews read in separate CTEs. One
    row per (order, seller) changes the answer: averaging over item rows reorders the top 3 (d9bd... first).
    No tie at the cut-off (4.69 vs 4.67).'
  verified: true
